name: CI

on:
  push:
  pull_request:

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m compileall -q src
      - run: chatgpt-archive --help

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: unzip -l dist/*.whl
      - run: tar -tzf dist/*.tar.gz
      - run: |
          ! unzip -l dist/*.whl | grep -E '(^|/)(\.env|data/|archive/|archives/|exports/|debug/|\.playwright-profile/|browser-state/|session-state/|auth-state/|cookies/|sessions/)|\.(db|sqlite|sqlite3|log)$'
          ! tar -tzf dist/*.tar.gz | grep -E '(^|/)(\.env|data/|archive/|archives/|exports/|debug/|\.playwright-profile/|browser-state/|session-state/|auth-state/|cookies/|sessions/)|\.(db|sqlite|sqlite3|log)$'
      - run: |
          python -m venv /tmp/chatgpt-archive-wheel-test
          /tmp/chatgpt-archive-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/chatgpt-archive-wheel-test/bin/chatgpt-archive --help
