[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-archive"
version = "1.0.0"
description = "Local-first archival tool for conversations owned by the authenticated ChatGPT user"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "typer>=0.12", "playwright>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# F catches undefined names/imports without requiring a broad formatting rewrite
# of the pre-existing proof-of-concept source.
select = ["F"]

[project.scripts]
chatgpt-archive = "chatgpt_archive.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
