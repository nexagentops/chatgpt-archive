[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt-archive"
version = "0.1.0"
description = "Local-first archival tool for conversations owned by the authenticated ChatGPT user"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "typer>=0.12", "playwright>=1.40"]

[project.scripts]
chatgpt-archive = "chatgpt_archive.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
